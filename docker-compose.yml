# Isolation manifest (isolation-docker-compose ADR): 5 subject arms + harness service.
# No host ~/.claude or ~/.config mounts, ever. Credential only via env_file .env.
x-common: &common
  env_file:
    - path: .env
      required: false # committed .env.example documents the keys; .env is local-only
  environment:
    # bare name: passed through only when set in the shell running compose,
    # so `ANTHROPIC_MODEL=... ./scripts/bench.sh` overrides the .env line for
    # one run and an unset shell leaves the .env value in place
    - ANTHROPIC_MODEL

services:
  baseline:
    <<: *common
    build:
      context: arms
      dockerfile: Dockerfile.baseline

  openspec:
    <<: *common
    build:
      context: arms
      dockerfile: Dockerfile.openspec

  superpowers:
    <<: *common
    build:
      context: arms
      dockerfile: Dockerfile.superpowers

  ni:
    <<: *common
    build:
      context: arms
      dockerfile: Dockerfile.ni
      args:
        # local: an unpublished checkout staged by scripts/stage-ni-local.sh
        NI_SOURCE: ${NI_SOURCE:-marketplace}

  mattpocock:
    <<: *common
    build:
      context: arms
      dockerfile: Dockerfile.mattpocock

  # simulator + judge; plugin-free, reuses the base image — not a subject arm
  harness:
    <<: *common
    build:
      context: arms
      dockerfile: Dockerfile.base
